syntax = "proto3";

option go_package = "rpc-chat/chat";

service Chat {
  rpc RequestChat (PeerInfo) returns (RequestChatReply) {}
  rpc StartChatChannel (stream ChatMessage) returns (stream ChatMessage) {}
}

message RequestChatReply {
  bool accept = 1;
  PeerInfo peerInfo = 2;
  string rejectionReason = 3;
}

message ChatMessage {
  string content = 1;
}

message PeerInfo {
  string username = 1;
}
